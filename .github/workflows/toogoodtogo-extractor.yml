name: Too Good To Go Invoice Extractor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/extract-toogoodtogo-invoices/**"
      - "data/toogoodtogo/**"
      - "website/_data/toogoodtogo.yml"
      - ".github/workflows/toogoodtogo-extractor.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scripts/extract-toogoodtogo-invoices

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv sync --dev

      - name: Check formatting
        run: pipenv run black --check .

      - name: Extracted data matches committed YAML
        run: pipenv run python -m unittest -v test_extract_toogoodtogo_invoices
