name: Jekyll Build Errors and Warnings

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version comes from website/.ruby-version;
          # bundler-cache installs the gems and caches them.
          bundler-cache: true
          working-directory: './website'

      - name: Build site and check for warnings or errors
        run: |
          cd website
          bundle exec jekyll build 2>&1 | tee build.log
          ! grep -E 'warning|error' build.log
